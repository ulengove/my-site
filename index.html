<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Evgesha Ultimate</title>

<style>

/* ===== БАЗА ===== */
body {
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f0f0f;
  color:white;
  overflow-x:hidden;
  transition:0.5s;
}

h1 {
  margin-top:60px;
  font-size:3em;
  text-shadow:0 0 20px #00ff88;
}

button {
  padding:12px 20px;
  margin:8px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  background:#00ff88;
  color:black;
  transition:0.2s;
}

button:hover {
  transform:scale(1.1);
}

/* ===== СЕКЦИИ ===== */
.section {
  padding:40px;
}

/* ===== НЕОН ===== */
.neon {
  text-shadow:0 0 10px #00ff88,0 0 20px #00ff88;
}

/* ===== СЕТКА ИГРЫ ===== */
.grid {
  display:grid;
  grid-template-columns:repeat(5,70px);
  gap:10px;
  justify-content:center;
  margin-top:20px;
}

.cell {
  width:70px;
  height:70px;
  background:#222;
  border-radius:10px;
  cursor:pointer;
}

.safe { background:#00ff88 !important; }
.mine { background:red !important; }

/* ===== АНИМАЦИИ ===== */
@keyframes glow {
  0% {text-shadow:0 0 5px #00ff88;}
  50% {text-shadow:0 0 25px #00ff88;}
  100% {text-shadow:0 0 5px #00ff88;}
}

.glow {
  animation:glow 2s infinite;
}

/* ===== ТЕМЫ ===== */
.light {
  background:white;
  color:black;
}

/* ===== СЕКРЕТЫ ===== */
.hidden {
  display:none;
}

/* ===== ПУЛЬС ===== */
@keyframes pulse {
  0% {transform:scale(1);}
  50% {transform:scale(1.2);}
  100% {transform:scale(1);}
}

.pulse {
  animation:pulse 1s infinite;
}

</style>
</head>

<body>

<h1 class="glow">Evgesha 👾</h1>
<p>Ultimate Website</p>

<div class="section">

<button onclick="startGame()">🎮 Играть</button>
<button onclick="toggleTheme()">🌙 Тема</button>
<button onclick="randomMsg()">💬 Сообщение</button>
<button onclick="secret()">🔥 Секрет</button>
<button onclick="hack()">🧪 Хак режим</button>

<a href="https://t.me/ulevgesha" target="_blank">
<button>💬 Telegram</button>
</a>

</div>

<div id="msg"></div>

<div id="game" class="section hidden">
<h2>Игра: не попади на мину</h2>
<div id="score">Очки: 0</div>
<div id="status">Живи 😈</div>
<div class="grid" id="grid"></div>
</div>

<div id="secretBlock" class="hidden section">
<h2>Ты нашёл секрет 😎</h2>
<p>Теперь ты в системе...</p>
</div>

<script>

/* ===== ДАННЫЕ ===== */
let score = 0;
let mines = [];
let gameActive = false;

/* ===== СТАРТ ИГРЫ ===== */
function startGame(){
  gameActive = true;
  score = 0;
  document.getElementById("score").innerText="Очки: 0";
  document.getElementById("game").classList.remove("hidden");

  let grid = document.getElementById("grid");
  grid.innerHTML="";

  mines = [];
  while(mines.length<3){
    let m = Math.floor(Math.random()*25);
    if(!mines.includes(m)) mines.push(m);
  }

  for(let i=0;i<25;i++){
    let cell=document.createElement("div");
    cell.className="cell";

    cell.onclick=()=>{
      if(!gameActive) return;

      if(mines.includes(i)){
        cell.classList.add("mine");
        document.getElementById("status").innerText="💀 Ты умер";
        gameActive=false;
      } else {
        cell.classList.add("safe");
        score++;
        document.getElementById("score").innerText="Очки: "+score;

        if(score===22){
          document.getElementById("status").innerText="🏆 ПОБЕДА";
          gameActive=false;
        }
      }
    };

    grid.appendChild(cell);
  }
}

/* ===== СООБЩЕНИЯ ===== */
function randomMsg(){
  let arr=[
    "Ты легенда 💀",
    "Сайт имба",
    "Нажми секрет 👀",
    "Ты в матрице",
    "Где ты это нашёл?"
  ];
  document.getElementById("msg").innerText =
    arr[Math.floor(Math.random()*arr.length)];
}

/* ===== ТЕМА ===== */
function toggleTheme(){
  document.body.classList.toggle("light");
}

/* ===== СЕКРЕТ ===== */
function secret(){
  document.getElementById("secretBlock").classList.toggle("hidden");
}

/* ===== ХАК РЕЖИМ ===== */
function hack(){
  document.body.style.background="black";
  document.body.innerHTML+="<p class='pulse'>ACCESS GRANTED</p>";
}

/* ===== ПАСХАЛКА: КЛАВИШИ ===== */
let code="";
document.addEventListener("keydown",e=>{
  code+=e.key;

  if(code.includes("1337")){
    alert("😎 ХАКЕР");
  }

  if(code.length>10) code="";
});

/* ===== КЛИК ПАСХАЛКА ===== */
let clicks=0;
document.body.addEventListener("click",()=>{
  clicks++;
  if(clicks===20){
    alert("👀 ты слишком много кликаешь");
  }
});

/* ===== АВТО СООБЩЕНИЕ ===== */
setInterval(()=>{
  console.log("ты наблюдаешься...");
},3000);

/* ===== ФЕЙК ЗАГРУЗКА ===== */
window.onload=()=>{
  console.log("SYSTEM LOADED");
};

/* ===== ЕЩЁ ПРИКОЛЫ ===== */
function randomBg(){
  let colors=["#111","#222","#333","#000"];
  document.body.style.background =
    colors[Math.floor(Math.random()*colors.length)];
}

setInterval(randomBg,15000);

/* ===== ЕЩЁ СЕКРЕТ ===== */
document.addEventListener("mousemove",e=>{
  if(e.clientX<10 && e.clientY<10){
    alert("нашёл угол 😎");
  }
});

/* ===== СПАМ СЕКРЕТ ===== */
let secretClicks=0;
document.addEventListener("dblclick",()=>{
  secretClicks++;
  if(secretClicks===5){
    alert("💀 ультра секрет");
  }
});

</script>

</body>
</html>
