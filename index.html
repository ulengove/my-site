<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Evgesha</title>

<style>

/* ===== ФОН ===== */
body {
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at top, #0f2027, #203a43, #000);
  color:white;
  text-align:center;
  overflow-x:hidden;
}

/* ===== АНИМАЦИЯ ФОНА ===== */
canvas {
  position:fixed;
  top:0;
  left:0;
  z-index:-1;
}

/* ===== КАРТОЧКА ===== */
.container {
  margin-top:80px;
  backdrop-filter: blur(20px);
  background: rgba(255,255,255,0.05);
  padding:40px;
  border-radius:20px;
  box-shadow:0 0 40px rgba(0,255,150,0.2);
  display:inline-block;
}

/* ===== ТЕКСТ ===== */
h1 {
  font-size:3em;
  text-shadow:0 0 20px #00ffcc;
}

/* ===== КНОПКИ ===== */
.btn {
  padding:12px 25px;
  margin:10px;
  border:none;
  border-radius:12px;
  background: linear-gradient(45deg,#00ffcc,#00ff88);
  cursor:pointer;
  font-weight:bold;
  transition:0.2s;
}

.btn:hover {
  transform:scale(1.1);
  box-shadow:0 0 20px #00ffcc;
}

/* ===== ИГРА ===== */
.grid {
  display:grid;
  grid-template-columns:repeat(5,60px);
  gap:10px;
  justify-content:center;
  margin-top:20px;
}

.cell {
  width:60px;
  height:60px;
  background:#111;
  border-radius:10px;
  cursor:pointer;
  transition:0.2s;
}

.safe { background:#00ff88 !important; }
.mine { background:red !important; }

/* ===== СЕКРЕТ ===== */
.hidden { display:none; }

/* ===== НЕОН ===== */
.neon {
  text-shadow:0 0 10px #00ffcc,0 0 30px #00ffcc;
}

</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="container">

<h1 class="neon">Evgesha 👾</h1>
<p>Welcome to my digital zone</p>

<button class="btn" onclick="startGame()">🎮 Играть</button>
<button class="btn" onclick="secret()">🔥 Секрет</button>
<button class="btn" onclick="sound()">🔊 Звук</button>
<button class="btn" onclick="hack()">🧪 Hack</button>

<a href="https://t.me/ulevgesha" target="_blank">
<button class="btn">💬 Telegram</button>
</a>

<div id="game" class="hidden">
<div id="score">Очки: 0</div>
<div class="grid" id="grid"></div>
</div>

<div id="secretBlock" class="hidden">
<h2>😎 Ты нашёл скрытый уровень</h2>
</div>

</div>

<script>

/* ===== ЧАСТИЦЫ ===== */
let canvas=document.getElementById("bg");
let ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];
for(let i=0;i<80;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:Math.random()*2
  });
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#00ffcc";
  particles.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
    p.y+=0.3;
    if(p.y>canvas.height) p.y=0;
  });
  requestAnimationFrame(draw);
}
draw();

/* ===== ИГРА ===== */
let mine;
let score=0;

function startGame(){
  document.getElementById("game").classList.remove("hidden");
  let grid=document.getElementById("grid");
  grid.innerHTML="";
  score=0;

  mine=Math.floor(Math.random()*25);

  for(let i=0;i<25;i++){
    let cell=document.createElement("div");
    cell.className="cell";

    cell.onclick=()=>{
      if(i===mine){
        cell.classList.add("mine");
        alert("💀 проиграл");
      } else {
        cell.classList.add("safe");
        score++;
        document.getElementById("score").innerText="Очки: "+score;
      }
    };

    grid.appendChild(cell);
  }
}

/* ===== СЕКРЕТ ===== */
function secret(){
  document.getElementById("secretBlock").classList.toggle("hidden");
}

/* ===== ЗВУК ===== */
function sound(){
  let audio=new Audio("https://www.soundjay.com/button/sounds/button-3.mp3");
  audio.play();
}

/* ===== ХАК ===== */
function hack(){
  document.body.style.background="black";
  document.body.innerHTML+="<h2 style='color:#00ff00'>ACCESS GRANTED</h2>";
}

/* ===== ПАСХАЛКИ ===== */
let clicks=0;
document.addEventListener("click",()=>{
  clicks++;
  if(clicks===15){
    alert("👀 ты что-то ищешь...");
  }
});

/* ===== КОД ===== */
let code="";
document.addEventListener("keydown",e=>{
  code+=e.key;
  if(code.includes("secret")){
    alert("😎 найден код");
  }
});

</script>

</body>
</html>
